query StoreProductRoster($first: Int, $after: String) {
  storeProducts(first: $first, after: $after) {
    edges {
      node {
        id
        storeCategoryCode
        title
        description
        priceMinor
        currency
        providerId
        productTypeId
        status
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}
